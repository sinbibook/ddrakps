<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder/fallback 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/common.css" />

    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub4_1 sub_reserve">
          <!-- data-* 속성 : data-reservation-hero-image -->
          <div class="sub_visual" data-reservation-hero-image>
            <div class="txt_box">
              <h3>RESERVATION</h3>
              <!-- data-* 속성 : data-property-name -->
              <p>
                <span data-property-name></span>
                , 이용안내
              </p>
            </div>
          </div>
          <div class="sub_cate_wrap">
            <div class="sub_inner">
              <ul>
                <li>
                  <!-- data-* 속성 : data-booking-url -->
                  <a href="#!" target="_blank" data-booking-url>예약하기</a>
                </li>
                <li class="on"><a href="reservation.html">이용안내</a></li>
              </ul>
            </div>
          </div>
          <div class="sub_cont">
            <div class="inner">
              <div class="title_box">
                <!-- data-* 속성 : data-property-name-en -->
                <span class="logo_txt" data-property-name-en></span>
                <h3>Reservation Info</h3>
              </div>

              <dl class="reservation_box">
                <dt>
                  <!-- data-* 속성 : data-reservation-info-image -->
                  <img data-reservation-info-image alt="" />
                  <p>Information</p>
                </dt>
                <dd>
                  <!-- data-* 속성 : data-reservation-checkin-info ([입퇴실안내] 정적 + checkInOutInfo) -->
                  <p data-reservation-checkin-info></p>
                  <br />
                  <!-- data-* 속성 : data-reservation-usage-guide -->
                  <p data-reservation-usage-guide></p>
                </dd>
              </dl>
              <dl class="reservation_box">
                <dt>
                  <!-- data-* 속성 : data-reservation-refund-image -->
                  <img data-reservation-refund-image alt="" />
                  <p>Refund Info</p>
                </dt>
                <!-- data-* 속성 : data-reservation-refund-policies | 동적 매핑 필요 -->
                <dd data-reservation-refund-policies></dd>
              </dl>
            </div>
          </div>
        </section>
      </div>
      <div id="footer-wrap"></div>
    </div>

    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
