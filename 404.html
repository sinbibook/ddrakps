<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder/fallback 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>속초 뜨락 펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/common.css" />
    <link rel="stylesheet" type="text/css" href="styles/sub.css" />
    <style>
      .error_wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
        padding: 120px 20px 80px;
      }
      .error_wrap .error_code {
        font-size: 120px;
        font-weight: 900;
        color: #2d3a80;
        line-height: 1;
        margin-bottom: 20px;
        letter-spacing: -4px;
      }
      .error_wrap .error_title {
        font-size: 24px;
        font-weight: 700;
        color: #111;
        margin-bottom: 14px;
      }
      .error_wrap .error_msg {
        font-size: 15px;
        color: #666;
        line-height: 1.8;
        margin-bottom: 40px;
      }
      .error_wrap .btn_home {
        display: inline-block;
        padding: 14px 40px;
        border: 1px solid #333;
        font-size: 14px;
        color: #333;
        text-decoration: none;
        letter-spacing: 0.05em;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .error_wrap .btn_home:hover {
        background: #333;
        color: #fff;
      }
      @media (max-width: 768px) {
        .error_wrap .error_code {
          font-size: 72px;
        }
        .error_wrap .error_title {
          font-size: 18px;
        }
        .error_wrap .error_msg {
          font-size: 13px;
        }
      }
    </style>
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="속초 뜨락 펜션" />

  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/28/IFwqVDXdEjgr.jpg" />
  <meta property="og:url" content="https://ddrakps.kr" />

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">

            <p class="error_msg">
              요청하신 페이지가 존재하지 않거나 비활성화되었습니다.
